# Admin panel settings. If your GitHub repository has a different name, change "repo" below.
backend:
  name: github
  repo: firuzapasha/firuzapasha.github.io
  branch: main
site_url: https://firuzapasha.github.io
display_url: https://firuzapasha.github.io
media_folder: images/uploads
public_folder: /images/uploads
collections:
- name: projects
  label: Projects
  icon: photo_library
  files:
  - name: projects
    label: Projects — add, edit, archive, delete, reorder
    file: content/projects.json
    fields:
    - name: items
      label: Projects
      label_singular: project
      widget: list
      summary: '{{fields.title.en}} · {{fields.client}} · {{fields.status}}'
      collapsed: true
      fields:
      - name: title
        label: Project title
        widget: object
        fields:
        - name: en
          label: English
          widget: string
        - name: de
          label: Deutsch
          widget: string
          required: false
      - name: client
        label: Client
        widget: string
        required: false
      - name: category
        label: Category
        widget: select
        options:
        - label: Social Media
          value: social
        - label: 3D & Motion
          value: motion
        - label: Branding
          value: brand
        - label: Print
          value: print
        - label: Web & UI
          value: web
        - label: Other
          value: other
        default: social
      - name: status
        label: Visibility
        widget: select
        hint: Archive to hide a project without deleting it.
        default: published
        options:
        - label: Published — visible on the site
          value: published
        - label: Archived — hidden, kept here
          value: archived
      - name: featured
        label: Show on home page
        widget: boolean
        required: false
        default: false
      - name: year
        label: Year
        widget: string
        required: false
      - name: cover_image
        label: Cover image
        widget: image
        required: false
        hint: Upload a cover. Leave empty to use the drawn cover below.
      - name: cover_style
        label: Drawn cover style (used when no cover image)
        widget: select
        required: false
        default: brand
        options:
        - label: Posters
          value: posters
        - label: Phone / social post
          value: phone
        - label: 3D shapes
          value: 3d
        - label: Big letter (branding)
          value: brand
        - label: Logo shape
          value: logo
        - label: Print sheets
          value: print
        - label: Motion / video
          value: motion
        - label: Website
          value: web
      - name: cover_color
        label: Drawn cover colour
        widget: select
        required: false
        default: sand
        options:
        - label: Sand
          value: sand
        - label: Coral
          value: coral
        - label: Black
          value: ink
        - label: Sage
          value: sage
        - label: Lilac
          value: lilac
        - label: Sky
          value: sky
        - label: Butter
          value: butter
        - label: Blush
          value: blush
      - name: cover_letter
        label: Letter on drawn cover
        widget: string
        required: false
        hint: One or two characters, e.g. R
      - name: behance
        label: Behance link
        widget: string
        required: false
        hint: Optional. Adds a "View on Behance" button.
      - name: summary
        label: Short intro (shown big at the top of the project page)
        widget: object
        fields:
        - name: en
          label: English
          widget: text
          required: false
        - name: de
          label: Deutsch
          widget: text
          required: false
      - name: body
        label: Project text
        widget: object
        fields:
        - name: en
          label: English
          widget: richtext
          required: false
        - name: de
          label: Deutsch
          widget: richtext
          required: false
        hint: Write about the brief, idea and result. You can use headings, lists, links and images.
      - name: gallery
        label: Gallery images
        widget: list
        required: false
        label_singular: image
        summary: '{{fields.caption.en}}'
        fields:
        - name: image
          label: Image
          widget: image
        - name: caption
          label: Caption
          widget: object
          fields:
          - name: en
            label: English
            widget: string
            required: false
          - name: de
            label: Deutsch
            widget: string
            required: false
        - name: wide
          label: Full width
          widget: boolean
          required: false
          default: false
      hint: Drag to reorder. The order here is the order on the site.
    - name: page_title
      label: '"All work" page title'
      widget: object
      fields:
      - name: en
        label: English
        widget: string
      - name: de
        label: Deutsch
        widget: string
        required: false
    - name: page_intro
      label: '"All work" page intro'
      widget: object
      fields:
      - name: en
        label: English
        widget: text
      - name: de
        label: Deutsch
        widget: text
        required: false
    - name: more_text
      label: Text in the Behance box at the bottom
      widget: object
      fields:
      - name: en
        label: English
        widget: string
      - name: de
        label: Deutsch
        widget: string
        required: false
      hint: 'Tip: put a word between *stars* to make it orange italic. A new line starts a new line.'
