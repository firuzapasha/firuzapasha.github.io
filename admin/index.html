<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Admin — Portfolio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2216%22 fill=%22%23FF4D2E%22/%3E%3Ctext x=%2214%22 y=%2243%22 font-family=%22Arial%22 font-weight=%22700%22 font-size=%2228%22 fill=%22%23fff%22%3EFP%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js" defer></script>
<style>
:root{
  --paper:#F3EFE8; --paper-2:#EAE4D9; --card:#FBF9F5; --ink:#141414; --ink-2:#3a3835; --muted:#7B766E; --line:rgba(20,20,20,.1); --line-2:rgba(20,20,20,.18);
  --accent:#FF4D2E; --accent-soft:#FFE3DB; --ok:#1F9D63; --ok-soft:#DDF3E8; --warn:#B7791F; --warn-soft:#FBF0D9;
  --sans:"Inter Tight",system-ui,-apple-system,"Segoe UI",sans-serif; --serif:"Instrument Serif",Georgia,serif;
  --ease:cubic-bezier(.22,1,.36,1); --r:16px; --r-s:10px;
  --side:248px; --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit}
em.s{font-family:var(--serif);font-style:italic;font-weight:400}
.hidden{display:none!important}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:99px;font-weight:500;font-size:14.5px;white-space:nowrap;transition:background .2s,color .2s,border-color .2s,transform .2s var(--ease),opacity .2s;border:1px solid transparent}
.btn:active{transform:scale(.97)}
.btn-dark{background:var(--ink);color:var(--paper)}
.btn-dark:hover{background:#000}
.btn-accent{background:var(--accent);color:#fff}
.btn-accent:hover{background:#ec3d1e}
.btn-line{border-color:var(--line-2);background:transparent}
.btn-line:hover{border-color:var(--ink)}
.btn-ghost{color:var(--muted)}
.btn-ghost:hover{color:var(--ink);background:rgba(0,0,0,.04)}
.btn-danger{color:#C2321A;border-color:rgba(194,50,26,.3)}
.btn-danger:hover{background:#C2321A;color:#fff;border-color:#C2321A}
.btn-sm{height:34px;padding:0 13px;font-size:13.5px}
.btn[disabled]{opacity:.5;pointer-events:none}
.icon-btn{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);transition:background .2s,color .2s}
.icon-btn:hover{background:rgba(0,0,0,.06);color:var(--ink)}
.icon-btn svg,.btn svg{width:18px;height:18px;flex:none}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* ---------- login ---------- */
.login{min-height:100svh;display:grid;place-items:center;padding:24px}
.login-card{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:36px 32px;box-shadow:0 30px 60px -40px rgba(0,0,0,.25)}
.login h1{font-size:40px;letter-spacing:-.04em;line-height:1;font-weight:600;margin:22px 0 10px}
.login p{color:var(--muted)}
.login .field{margin-top:24px}
.login details{margin-top:18px;font-size:14px;color:var(--ink-2)}
.login summary{cursor:pointer;color:var(--ink);font-weight:500}
.login ol{margin:12px 0 0 18px;display:grid;gap:6px}
.login .err{color:#C2321A;font-size:14px;margin-top:10px;min-height:20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.03em;font-size:18px}
.brand i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block}
.brand small{font-weight:500;color:var(--muted);letter-spacing:0;font-size:13px;border:1px solid var(--line-2);border-radius:99px;padding:3px 10px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--side) 1fr;min-height:100svh}
.side{position:sticky;top:0;height:100svh;border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:6px;background:var(--paper)}
.side .brand{padding:4px 10px 22px}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--ink-2);font-weight:500;transition:background .2s,color .2s;text-decoration:none}
.nav-item svg{width:19px;height:19px;flex:none;opacity:.75}
.nav-item:hover{background:rgba(0,0,0,.045)}
.nav-item.on{background:var(--ink);color:var(--paper)}
.nav-item.on svg{opacity:1}
.nav-item .cnt{margin-left:auto;font-size:12px;opacity:.6}
.side-foot{margin-top:auto;display:grid;gap:6px;padding-top:16px;border-top:1px solid var(--line)}
.who{display:flex;align-items:center;gap:10px;padding:8px 10px;font-size:13.5px;color:var(--muted)}
.who img{width:28px;height:28px;border-radius:50%}
.main{min-width:0;padding:0 clamp(18px,4vw,48px) 140px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:16px 0;background:linear-gradient(var(--paper) 75%,rgba(243,239,232,0))}
.top h2{font-size:clamp(26px,3vw,34px);letter-spacing:-.04em;font-weight:600;line-height:1.05;min-width:0}
.top h2 .crumb{color:var(--muted);font-weight:500;cursor:pointer}
.top .sp{flex:1}
.mob-brand{display:none}
.lang-sw{position:relative;display:flex;border:1px solid var(--line-2);border-radius:99px;padding:3px;background:var(--card)}
.lang-sw button{position:relative;z-index:1;height:30px;padding:0 13px;font-size:12.5px;font-weight:600;letter-spacing:.04em;border-radius:99px;transition:color .3s}
.lang-sw button.on{color:var(--paper)}
.lang-sw i{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:99px;background:var(--ink);transition:transform .4s var(--ease)}
.lang-sw.de i{transform:translateX(100%)}
.tabbar{display:none}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .mob-brand{display:flex}
  .top{padding:12px 0 10px;flex-wrap:wrap}
  .top h2{order:3;width:100%;font-size:28px;margin-top:4px}
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(251,249,245,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--safe-b))}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted);text-decoration:none;padding:6px 0;border-radius:10px}
  .tabbar a svg{width:22px;height:22px}
  .tabbar a.on{color:var(--ink)}
  .tabbar a.on svg{color:var(--accent)}
  .main{padding-bottom:170px}
  .view-site{width:34px;padding:0}
  .newcard{min-height:76px;display:flex;justify-content:center;gap:12px}
  .newcard .plus{margin:0;width:36px;height:36px;font-size:20px}
  .view-site .vs-t{display:none}
}

/* ---------- panels & fields ---------- */
.intro{color:var(--muted);max-width:60ch;margin:-2px 0 22px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px}
.panel-h{display:flex;align-items:center;gap:12px;padding:18px 22px;cursor:pointer;user-select:none}
.panel-h h3{font-size:17px;font-weight:600;letter-spacing:-.02em}
.panel-h p{font-size:13.5px;color:var(--muted)}
.panel-h .chev{margin-left:auto;transition:transform .35s var(--ease);color:var(--muted)}
.panel.closed .chev{transform:rotate(-90deg)}
.panel-b{padding:4px 22px 22px;display:grid;gap:18px}
.panel.closed .panel-b{display:none}
.field{display:grid;gap:7px;min-width:0}
.field>label,.field .lbl{font-size:13px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lbl .tag{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line-2);border-radius:6px;padding:1px 6px}
.lbl .miss{font-size:11.5px;font-weight:500;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:1px 7px}
.hint{font-size:12.5px;color:var(--muted)}
.inp{width:100%;background:#fff;border:1px solid var(--line-2);border-radius:var(--r-s);padding:11px 13px;outline:none;transition:border-color .2s,box-shadow .2s;font-size:15px}
.inp:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(20,20,20,.07)}
textarea.inp{resize:vertical;min-height:88px;line-height:1.5}
textarea.inp.mdta{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13.5px;min-height:220px}
.inp::placeholder{color:#b3ada4}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media (max-width:640px){.row2,.row3{grid-template-columns:1fr}}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg button{height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line-2);font-size:14px;transition:all .2s;background:#fff}
.seg button:hover{border-color:var(--ink)}
.seg button.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.seg.ok button.on{background:var(--ok);border-color:var(--ok)}
.seg.arch button.on{background:#7B766E;border-color:#7B766E}
.toggle{display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none}
.toggle .sw{width:44px;height:26px;border-radius:99px;background:#d7d1c7;position:relative;transition:background .25s;flex:none}
.toggle .sw::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:3px;left:3px;transition:transform .3s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on .sw{background:var(--accent)}
.toggle.on .sw::after{transform:translateX(18px)}
.toggle b{font-weight:500}
.toggle small{display:block;color:var(--muted);font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#fff;border:1px solid var(--line-2);border-radius:var(--r-s);padding:7px}
.chips:focus-within{border-color:var(--ink);box-shadow:0 0 0 3px rgba(20,20,20,.07)}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--paper);border-radius:99px;padding:5px 6px 5px 12px;font-size:14px}
.chip button{width:20px;height:20px;border-radius:50%;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.chip button:hover{background:var(--ink);color:#fff}
.chips input{flex:1;min-width:120px;border:0;outline:0;padding:5px 6px;background:transparent}
.dots{display:flex;gap:6px}
.dots button{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-2);transition:all .2s}
.dots button.f{background:var(--ink);border-color:var(--ink)}

/* list editor */
.list{display:grid;gap:8px}
.item{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item-h{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 14px;cursor:pointer}
.item-h .t{flex:1;min-width:0;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-h .t small{color:var(--muted);font-weight:400;margin-left:6px}
.item-b{padding:4px 14px 16px;display:grid;gap:14px;border-top:1px solid var(--line)}
.item:not(.open) .item-b{display:none}
.item.open{box-shadow:0 10px 30px -20px rgba(0,0,0,.3)}
.add-row{justify-self:start}

/* image field */
.imgf{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.imgf .thumb{width:140px;aspect-ratio:var(--ar,4/3);border-radius:12px;overflow:hidden;background:var(--paper-2);border:1px dashed var(--line-2);display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;flex:none;position:relative}
.imgf .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.imgf .thumb.has{border-style:solid}
.imgf .acts{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.drop{outline:2px dashed var(--accent);outline-offset:4px}
.pend{position:absolute;left:6px;top:6px;font-size:10.5px;font-weight:600;background:var(--accent);color:#fff;border-radius:6px;padding:2px 6px}

/* videos inside covers */
.cv video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
/* file field */
.filebox{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px dashed var(--line-2);border-radius:12px;padding:12px}
.filebox .fico{width:40px;height:48px;border-radius:6px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;flex:none}
.filebox .fname{flex:1;min-width:140px;font-weight:500;word-break:break-all}
.filebox .fname small{display:block;color:var(--muted);font-weight:400;font-size:12.5px}
.imgf .thumb video,.gtile .gi video{width:100%;height:100%;object-fit:cover;display:block}
/* markdown */
.md-bar{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.md-bar button{height:30px;min-width:30px;padding:0 9px;border-radius:8px;border:1px solid var(--line-2);background:#fff;font-size:13px;font-weight:600}
.md-bar button:hover{border-color:var(--ink)}
.md-bar .sp{flex:1}
.md-prev{background:#fff;border:1px solid var(--line-2);border-radius:var(--r-s);padding:14px 16px;min-height:120px;line-height:1.65}
.md-prev>*+*{margin-top:.8em}.md-prev h2{font-size:22px;letter-spacing:-.02em}.md-prev h3{font-size:18px}.md-prev ul,.md-prev ol{padding-left:1.2em}.md-prev a{color:var(--accent)}

/* ---------- projects grid ---------- */
.pbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.pbar .sp{flex:1}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.pcard{text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:transform .35s var(--ease),box-shadow .35s var(--ease);position:relative;text-align:left;display:block;width:100%}
.pcard:hover{transform:translateY(-3px);box-shadow:0 20px 40px -26px rgba(0,0,0,.35)}
.pcard .media{position:relative;aspect-ratio:4/3;overflow:hidden}
.pcard .media .cv{position:absolute;inset:0}
.pcard .media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pcard.arch .media{filter:grayscale(1);opacity:.55}
.pcard .meta{padding:12px 14px 14px}
.pcard .t{font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .c{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badges{position:absolute;left:10px;top:10px;display:flex;gap:6px;z-index:3}
.badge{font-size:11.5px;font-weight:600;border-radius:99px;padding:4px 9px;background:rgba(255,255,255,.85);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:inline-flex;align-items:center;gap:4px}
.badge.star{background:var(--accent);color:#fff}
.badge.ar{background:#7B766E;color:#fff}
.plink{display:block;text-decoration:none;color:inherit}
.pfoot{border-top:1px solid var(--line);padding:8px 10px}
.home-sw{display:flex;align-items:center;gap:10px;width:100%;padding:6px 6px;border-radius:10px;font-size:13.5px;font-weight:500;color:var(--ink-2);transition:background .2s}
.home-sw:hover{background:rgba(0,0,0,.04)}
.home-sw .sw{width:36px;height:22px;border-radius:99px;background:#d7d1c7;position:relative;transition:background .25s;flex:none}
.home-sw .sw::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:3px;left:3px;transition:transform .3s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.home-sw.on .sw{background:var(--accent)}
.home-sw.on .sw::after{transform:translateX(14px)}
.home-sw.on{color:var(--ink)}
.home-sw[disabled]{opacity:.5;cursor:default}
.newcard{border:1.5px dashed var(--line-2);background:transparent;display:grid;place-items:center;min-height:230px;color:var(--muted);font-weight:500;gap:8px;align-content:center}
.newcard:hover{border-color:var(--ink);color:var(--ink)}
.newcard .plus{width:48px;height:48px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:26px;margin:0 auto}
/* reorder list */
.rlist{display:grid;gap:8px}
.rrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 8px}
.rrow .mini{width:64px;aspect-ratio:4/3;border-radius:8px;overflow:hidden;position:relative;flex:none}
.rrow .mini .cv,.rrow .mini img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rrow .t{flex:1;min-width:0;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .t small{display:block;color:var(--muted);font-weight:400;font-size:12.5px}
.rrow.dragging{opacity:.4}
.rrow .grip{cursor:grab;color:var(--muted);padding:0 4px}

/* cover style picker */
.styles{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.styles button{border-radius:10px;overflow:hidden;aspect-ratio:4/3;position:relative;border:2px solid transparent;transition:border-color .2s}
.styles button .cv{position:absolute;inset:0}
.styles button.on{border-color:var(--ink)}
.styles button span{position:absolute;left:5px;bottom:5px;font-size:10.5px;font-weight:600;background:rgba(255,255,255,.85);border-radius:5px;padding:1px 5px;z-index:4}
.swatch{display:flex;gap:8px;flex-wrap:wrap}
.swatch button{width:34px;height:34px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line-2);transition:box-shadow .2s}
.swatch button.on{box-shadow:0 0 0 2px var(--ink)}
.cover-big{width:100%;max-width:440px;aspect-ratio:4/3;border-radius:14px;overflow:hidden;position:relative;border:1px solid var(--line)}
.cover-big .cv,.cover-big img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* gallery */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.gtile .gacts .icon-btn{width:32px;height:32px}
.gtile{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.gtile .gi{aspect-ratio:4/3;background:var(--paper-2);position:relative}
.gtile .gi img{width:100%;height:100%;object-fit:cover;display:block}
.gtile .gb{padding:10px;display:grid;gap:8px}
.gtile .gacts{display:flex;align-items:center;gap:2px}
.gtile .gacts .sp{flex:1}
.gadd{border:1.5px dashed var(--line-2);border-radius:12px;display:grid;place-items:center;min-height:200px;color:var(--muted);font-weight:500;text-align:center;gap:6px;align-content:center;padding:16px}
.gadd:hover{border-color:var(--ink);color:var(--ink)}

/* editor header */
.ed-head{display:flex;gap:18px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.ed-head .cover-mini{width:120px;aspect-ratio:4/3;border-radius:12px;overflow:hidden;position:relative;flex:none}
.ed-head .cover-mini .cv,.ed-head .cover-mini img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ed-head .info{flex:1;min-width:200px}
.ed-head .info .t{font-size:24px;font-weight:600;letter-spacing:-.03em;line-height:1.1}
.ed-head .info .c{color:var(--muted);margin-top:4px}
.ed-head .acts{display:flex;gap:8px;flex-wrap:wrap}

/* save bar */
.savebar{position:fixed;z-index:45;left:calc(var(--side) + 24px);right:24px;bottom:20px;display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--paper);border-radius:18px;padding:10px 10px 10px 20px;box-shadow:0 24px 50px -20px rgba(0,0,0,.5);transform:translateY(calc(100% + 120px));opacity:0;pointer-events:none;transition:transform .5s var(--ease),opacity .3s}
.savebar.on{transform:none;opacity:1;pointer-events:auto}
.savebar .msg{flex:1;min-width:0;font-size:14px}

/* toast / modal */

.toast.err .dot{background:#C2321A}
.toast.info .dot{background:var(--warn)}
.toast .tx{flex:1;font-size:14px}
.toast a{font-weight:600;font-size:13.5px;white-space:nowrap}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}
.modal{position:fixed;inset:0;z-index:70;background:rgba(20,20,20,.4);display:grid;place-items:center;padding:20px;animation:fin .25s}
@keyframes fin{from{opacity:0}}

.empty{padding:40px;text-align:center;color:var(--muted);border:1.5px dashed var(--line-2);border-radius:var(--r)}

/* drawn covers (same as the website) */

.cv{--bg:#E8E1D5;--fg:#141414;--a:#FF4D2E;--b:#fff;background:var(--bg);overflow:hidden}
.t-coral{--bg:#FF5A3C;--fg:#fff;--a:#141414;--b:#FFD9CF}
.t-ink{--bg:#161616;--fg:#F3EFE8;--a:#FF4D2E;--b:#3a3a3a}

/* posters */
.pp{position:absolute;left:50%;top:50%;width:34%;aspect-ratio:4/5;border-radius:6px;transition:transform 1s var(--ease);box-shadow:0 30px 50px -20px rgba(0,0,0,.35);display:flex;flex-direction:column;justify-content:space-between;padding:7%;overflow:hidden}

.card:hover .pp.p1{transform:translate(-50%,-50%) translateX(-78%) rotate(-14deg)}
.card:hover .pp.p2{transform:translate(-50%,-50%) translateX(78%) rotate(13deg)}

.o3.a{width:44%;aspect-ratio:1;left:30%;top:22%}
.o3.b{width:16%;aspect-ratio:1;left:14%;top:58%;animation-delay:-2s;background:radial-gradient(circle at 30% 26%,#fff,var(--fg) 70%)}
.o3.c{width:11%;aspect-ratio:1;left:74%;top:16%;animation-delay:-4s;background:radial-gradient(circle at 30% 26%,#fff,#bbb 60%,#666)}
.tor{position:absolute;width:62%;aspect-ratio:1;left:21%;top:13%;border-radius:50%;border:clamp(8px,1.4vw,20px) solid color-mix(in srgb,var(--fg) 85%,transparent);transform:rotateX(72deg) rotateZ(18deg);transition:transform 1.4s var(--ease)}

.floor{position:absolute;left:10%;right:10%;bottom:12%;height:12%;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.28),transparent 70%)}
/* brand */
.mono{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-style:italic;color:var(--fg);font-size:clamp(150px,22vw,360px);line-height:1;transition:transform 1.1s var(--ease)}

.grid-ln{position:absolute;inset:8%;border:1px solid color-mix(in srgb,var(--fg) 20%,transparent);background:linear-gradient(color-mix(in srgb,var(--fg) 12%,transparent),color-mix(in srgb,var(--fg) 12%,transparent)) center/1px 100% no-repeat,linear-gradient(color-mix(in srgb,var(--fg) 12%,transparent),color-mix(in srgb,var(--fg) 12%,transparent)) center/100% 1px no-repeat}

/* logo */
.lg{position:absolute;left:50%;top:50%;width:46%;aspect-ratio:1;transform:translate(-50%,-50%)}

.sheet{position:absolute;width:40%;aspect-ratio:1/1.41;left:50%;top:50%;background:var(--b);border-radius:3px;box-shadow:0 26px 40px -18px rgba(0,0,0,.35);padding:5%;display:flex;flex-direction:column;gap:6%;transition:transform 1s var(--ease)}

.play{position:absolute;left:50%;top:46%;width:22%;aspect-ratio:1;border-radius:50%;background:var(--a);transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;z-index:2}

.rings i:nth-child(2){animation-delay:1.2s}.rings i:nth-child(3){animation-delay:2.4s}

.tl{position:absolute;left:8%;right:8%;bottom:10%;height:3px;border-radius:2px;background:color-mix(in srgb,var(--fg) 20%,transparent)}

.tl::after{content:"";position:absolute;top:-4px;width:11px;height:11px;border-radius:50%;background:var(--fg);left:0;animation:progk 6s linear infinite;margin-left:-5px}
@keyframes prog{to{width:100%}}@keyframes progk{to{left:100%}}
.kf{position:absolute;left:8%;right:8%;bottom:15%;display:flex;justify-content:space-between}
.kf i{width:8px;height:8px;background:var(--a);transform:rotate(45deg)}
/* web */
.br{position:absolute;left:10%;right:10%;top:16%;bottom:-6%;background:var(--b);border-radius:10px 10px 0 0;box-shadow:0 30px 60px -20px rgba(0,0,0,.35);overflow:hidden;transition:transform 1s var(--ease)}

.br .im{border-radius:8px;background:var(--bg);aspect-ratio:1;position:relative;overflow:hidden}
.br .im::after{content:"";position:absolute;width:60%;aspect-ratio:1;border-radius:50%;background:var(--a);right:-14%;bottom:-14%;opacity:.85}
.br .row{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:7%}

/* social (phone) */
.ph{position:absolute;width:34%;aspect-ratio:9/18;left:50%;top:12%;transform:translateX(-50%);background:var(--fg);border-radius:clamp(14px,2vw,26px);padding:3%;box-shadow:0 30px 60px -20px rgba(0,0,0,.45);transition:transform 1s var(--ease);z-index:2}
.ph .sc{width:100%;height:100%;border-radius:clamp(10px,1.4vw,20px);background:var(--b);overflow:hidden;display:flex;flex-direction:column}
.ph .post{flex:1;background:var(--a);margin:10% 8% 0;border-radius:6px;position:relative;overflow:hidden}
.ph .post::after{content:"";position:absolute;width:70%;aspect-ratio:1;border-radius:50%;background:var(--bg);left:-20%;bottom:-20%}
.ph .lns{padding:8%;display:grid;gap:5px}
.ph .lns i{height:5px;border-radius:3px;background:var(--fg);opacity:.18}
.ph .lns i:last-child{width:60%}
.heart{position:absolute;z-index:3;right:22%;top:30%;width:clamp(34px,4vw,58px);aspect-ratio:1;border-radius:50%;background:var(--b);display:flex;align-items:center;justify-content:center;color:var(--a);font-size:clamp(16px,1.8vw,26px);box-shadow:0 10px 24px -8px rgba(0,0,0,.3);animation:pop 3s var(--ease) infinite}
@keyframes pop{0%,60%,100%{transform:scale(1)}70%{transform:scale(1.25)}80%{transform:scale(.95)}}
.card:hover .ph{transform:translateX(-50%) translateY(-4%) rotate(-3deg)}
.ph-bg{position:absolute;width:26%;aspect-ratio:1;border-radius:8px;background:var(--b);opacity:.55;left:12%;top:58%;transform:rotate(-12deg);transition:transform 1s var(--ease)}
.ph-bg.r{left:auto;right:10%;top:18%;transform:rotate(10deg);background:var(--a);opacity:.9}
.card:hover .ph-bg{transform:rotate(-20deg) translateX(-14%)}
.card:hover .ph-bg.r{transform:rotate(18deg) translateX(14%)}


@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* scale drawn covers to any thumbnail size */
.cv{container-type:size}

.cv .br .bar{height:4.5cqw}
.cv .swatches i{width:3.5cqw}

const b64ToText = b => new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g,'')), c=>c.charCodeAt(0)));
async function blobToB64(blob){ const buf = new Uint8Array(await blob.arrayBuffer()); let s=''; for (let i=0;i<buf.length;i+=0x8000) s += String.fromCharCode.apply(null, buf.subarray(i,i+0x8000)); return btoa(s); }

async function signIn(token){
  TOKEN = token;
  USER = await gh('/user');
  const repo = await gh('/repos/'+REPO);
  if (repo.permissions && repo.permissions.push===false) throw new Error('This key can read but not change '+REPO+'. Give it "Contents: Read and write".');
}
async function loadAll(){
  DATA = {};
  await Promise.all(FILES.map(async n=>{
    const f = await gh(`/repos/${REPO}/contents/content/${n}.json?ref=${BRANCH}`);
    DATA[n] = JSON.parse(b64ToText(f.content)); ORIG[n] = JSON.stringify(DATA[n]);
  }));
  // restore an unsaved draft from this browser, if any
  try {
    const d = JSON.parse(localStorage.getItem(DRAFT_KEY)||'null');
    if (d && d.repo===REPO && FILES.some(n=>d.data[n] && JSON.stringify(d.data[n])!==ORIG[n])){
      const ok = await confirmBox('Restore unsaved changes?', 'You have changes from '+new Date(d.at).toLocaleString()+' that were never published.', 'Restore', false);
      if (ok) FILES.forEach(n=>{ if(d.data[n]) DATA[n]=d.data[n] }); else localStorage.removeItem(DRAFT_KEY);
    }
  } catch(e){}
}
const changedFiles = () => FILES.filter(n => JSON.stringify(DATA[n]) !== ORIG[n]);
async function publish(){
  const files = changedFiles(); if (!files.length) return;
  const btn = $('#pubBtn'); btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Publishing…';
  try {
    const ref = await gh(`/repos/${REPO}/git/ref/heads/${BRANCH}`);
    const head = ref.object.sha;
    const base = await gh(`/repos/${REPO}/git/commits/${head}`);
    const all = JSON.stringify(DATA), tree = [], uploaded = [];
    for (const [path, blob] of Object.entries(PENDING)){
      if (!all.includes(path)) continue;
      const b = await gh(`/repos/${REPO}/git/blobs`, {method:'POST', body: JSON.stringify({content: await blobToB64(blob), encoding:'base64'})});
      tree.push({path: path.replace(/^\/+/,''), mode:'100644', type:'blob', sha:b.sha}); uploaded.push(path);
    }
    for (const n of files) tree.push({path:`content/${n}.json`, mode:'100644', type:'blob', content: JSON.stringify(DATA[n], null, 2) + '\n'});
    const t = await gh(`/repos/${REPO}/git/trees`, {method:'POST', body: JSON.stringify({base_tree: base.tree.sha, tree})});
    const names = {projects:'projects', home:'home page texts', experience:'experience', general:'profile & contact'};
    const c = await gh(`/repos/${REPO}/git/commits`, {method:'POST', body: JSON.stringify({message:'Update '+files.map(n=>names[n]).join(', ')+' (admin)', tree:t.sha, parents:[head]})});
    await gh(`/repos/${REPO}/git/refs/heads/${BRANCH}`, {method:'PATCH', body: JSON.stringify({sha:c.sha})});
    files.forEach(n => ORIG[n] = JSON.stringify(DATA[n]));
    uploaded.forEach(p => delete PENDING[p]);
    try{ localStorage.removeItem(DRAFT_KEY) }catch(e){}
    toast('Published! Your site updates in about a minute.', 'ok', {href:SITE, label:'View site ↗'}, 7000);
    watchLive(files);
  } catch(e){
    toast('Could not publish: ' + e.message + (e.status===401?' — your key may have expired. Sign out and sign in again.':''), 'err', null, 9000);
  }
  updateSaveBar();
}
async function watchLive(files){
  const n = files[0], want = ORIG[n], t0 = Date.now();
  while (Date.now()-t0 < 240000){
    await new Promise(r=>setTimeout(r, 8000));
    try { const live = await fetch(SITE+'content/'+n+'.json?ts='+Date.now(),{cache:'no-store'}).then(r=>r.json()); if (JSON.stringify(live)===want){ toast('Your website is now updated ✓','ok',{href:SITE,label:'Open ↗'},6000); return } } catch(e){}
  }
}

async function processImage(file, maxSide=2400){
  if (/svg|gif/.test(file.type)) return {blob:file, ext:file.name.split('.').pop().toLowerCase()};
  try {
    const bmp = await createImageBitmap(file);
    const s = Math.min(1, maxSide/Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width*s); c.height = Math.round(bmp.height*s);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    let blob = await new Promise(r=>c.toBlob(r,'image/webp',.86));
    if (blob && blob.type==='image/webp') return {blob, ext:'webp'};
    blob = await new Promise(r=>c.toBlob(r,'image/jpeg',.86)); return {blob, ext:'jpg'};
  } catch(e){ return {blob:file, ext:(file.name.split('.').pop()||'jpg').toLowerCase()} }
}
const MAX_VIDEO_MB = 40, MAX_FILE_MB = 20;
const isVid = p => /\.(mp4|webm|mov|m4v)(\?|$)/i.test(p||'');
const mediaEl = (p) => isVid(p) ? h('video',{src: imgSrc(p), autoplay:true, muted:true, loop:true, playsinline:true}) : h('img',{src: imgSrc(p), alt:''});
const mediaHTML = (p) => isVid(p) ? `<video src="${esc(imgSrc(p))}" autoplay muted loop playsinline></video>` : `<img src="${esc(imgSrc(p))}" alt="">`;
async function addImage(file, allowVideo){
  if (!file) return null;
  const base = slug(file.name.replace(/\.[^.]+$/,'')) + '-' + Date.now().toString(36);
  if (allowVideo && file.type.startsWith('video/')){
    if (file.size > MAX_VIDEO_MB*1024*1024){ toast(`This video is ${(file.size/1048576).toFixed(0)} MB. Please export it under ${MAX_VIDEO_MB} MB (e.g. 1080p MP4, about 10–20 seconds).`,'err',null,9000); return null }
    const ext = (file.name.split('.').pop()||'mp4').toLowerCase().replace('quicktime','mov');
    const path = `/images/uploads/${base}.${ext}`;
    PENDING[path] = file; PREVIEW[path] = URL.createObjectURL(file); return path;
  }
  if (!file.type.startsWith('image/')) { toast(allowVideo ? 'Please choose an image or a video.' : 'Please choose an image file.','err'); return null }
  const {blob, ext} = await processImage(file);
  const path = `/images/uploads/${base}.${ext}`;
  PENDING[path] = blob; PREVIEW[path] = URL.createObjectURL(blob);
  return path;
}
async function addFile(file){
  if (!file) return null;
  if (file.type !== 'application/pdf' && !/\.pdf$/i.test(file.name)) { toast('Please choose a PDF file.','err'); return null }
  if (file.size > MAX_FILE_MB*1024*1024){ toast(`This PDF is too big (max ${MAX_FILE_MB} MB).`,'err'); return null }
  const path = `/files/${slug(file.name.replace(/\.[^.]+$/,''))}-${Date.now().toString(36)}.pdf`;
  PENDING[path] = file; PREVIEW[path] = URL.createObjectURL(file);
  return path;
}

function dropZone(el, onFiles, allowVideo, onRaw){

    h('div',{class:'field'}, h('label',{},'Access key'), inp), btn, err,
    h('details',{}, h('summary',{},'How do I get an access key?'),
      h('ol',{},
        h('li',{}, 'Open ', h('a',{href:'https://github.com/settings/personal-access-tokens/new', target:'_blank', rel:'noopener'}, 'GitHub → new access key'), '.'),
        h('li',{}, 'Name it “Portfolio admin”, pick an expiry date.'),
        h('li',{}, 'Repository access: only ', h('b',{}, REPO.split('/')[1]), '.'),
        h('li',{}, 'Permissions → Contents → Read and write.'),
        h('li',{}, 'Generate, copy and paste it here.'))))));
  setTimeout(()=>inp.focus(), 50);
}
function signOut(){ try{ localStorage.removeItem(TOKEN_KEY) }catch(e){} TOKEN=null; DATA=null; location.hash=''; viewLogin(); }
async function start(){
  $('#app').innerHTML = '<div class="loading-screen"><div class="spin" style="width:26px;height:26px;margin:0 auto"></div>Loading your content…</div>';
  await loadAll(); render();
}
(async () => {
  let t = null; try { t = localStorage.getItem(TOKEN_KEY) } catch(e){}
  if (!t) return viewLogin();
  try { await signIn(t); await start(); }
  catch(e){ viewLogin(e.status===401 ? 'Your access key has expired or was removed. Please paste a new one.' : 'Could not connect: '+e.message); }
})();
})();
</script>
